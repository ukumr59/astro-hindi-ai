name: AstroPratidin Facebook Recovery 2026-08-23

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/facebook-recovery-2026-08-23.yml'

concurrency:
  group: astropratidin-facebook-recovery-2026-08-23
  cancel-in-progress: false

permissions:
  contents: read

env:
  TARGET_DATE_IST: '2026-08-23'

jobs:
  facebook_today:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v21-premium-9-5-architecture
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Facebook production components
        run: python -m py_compile video_engine/premium_entry_v21_1.py astro_engine/main.py scripts/build_daily_youtube_videos.py scripts/publish_facebook_daily.py
      - name: Generate today's horoscope content
        run: python -m astro_engine.main
      - name: Render today's combined video with retry
        run: |
          for n in 1 2; do python -m video_engine.premium_entry_v21_1 && exit 0; [ "$n" = 2 ] && exit 1; sleep 30; done
      - name: Build today's 12 Rashi videos with retry
        run: |
          for n in 1 2; do
            rm -rf output/youtube_uploads
            python scripts/build_daily_youtube_videos.py && [ "$(find output/youtube_uploads -maxdepth 1 -name '*.mp4' | wc -l)" -eq 12 ] && exit 0
            [ "$n" = 2 ] && exit 1
            sleep 30
          done
      - name: Validate and normalize Facebook publication media
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          files=[Path('output/daily_video.mp4')] + sorted(Path('output/youtube_uploads').glob('*.mp4'))
          if len(files) != 13:
              raise SystemExit(f'Expected exactly 13 daily Facebook videos, found {len(files)}')
          for f in files:
              if not f.is_file() or f.stat().st_size < 10240:
                  raise SystemExit(f'Invalid publication file: {f}')
              subprocess.run(['ffmpeg','-v','error','-xerror','-i',str(f),'-map','0:v:0','-f','null','-'],check=True)
              tmp=f.with_name(f.stem+'.fb.mp4')
              subprocess.run(['ffmpeg','-v','error','-xerror','-y','-i',str(f),'-map','0:v:0','-map','0:a?','-c:v','libx264','-pix_fmt','yuv420p','-movflags','+faststart','-c:a','aac','-b:a','128k',str(tmp)],check=True)
              subprocess.run(['ffmpeg','-v','error','-xerror','-i',str(tmp),'-map','0:v:0','-f','null','-'],check=True)
              tmp.replace(f)
          print('FACEBOOK MEDIA GATE: PASS (13 daily videos)')
          PY
      - name: Publish today's videos to Facebook only
        env:
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_API_VERSION: v25.0
        run: python scripts/publish_facebook_daily.py
      - name: Verify Facebook publication manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('output/facebook_publish_manifest.json')
          if not p.exists(): raise SystemExit('Missing facebook_publish_manifest.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          videos=data.get('videos',[])
          if len(videos) != 13: raise SystemExit(f'Expected 13 Facebook videos, got {len(videos)}')
          if not all(v.get('url') for v in videos): raise SystemExit('One or more Facebook videos has no discoverable permalink')
          print('FACEBOOK PUBLICATION: PASS (13 discoverable videos)')
          PY
      - name: Package recovery artifact
        if: always()
        run: '[ -d output ] && zip -qr facebook-recovery-2026-08-23.zip output || true'
      - name: Upload recovery artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: facebook-recovery-2026-08-23
          path: facebook-recovery-2026-08-23.zip
          if-no-files-found: warn
          retention-days: 14
