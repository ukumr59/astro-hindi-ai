name: Daily Astro Hindi Video - Production

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate bundled devotional assets
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          assets = Path('assets/deities')
          required = ['hanuman.jpg','lakshmi.jpg','ganesha.jpg','shiva.jpg','surya.jpg','vishnu.jpg','shani.jpg']
          for name in required:
              p = assets / name
              if not p.exists():
                  raise SystemExit(f'Missing deity asset: {p}')
              with Image.open(p) as im:
                  print(name, im.size, im.mode)
                  if im.width < 1200 or im.height < 1200:
                      raise SystemExit(f'Artwork is below 1200px: {p} -> {im.size}')
          font = Path('assets/NotoSansDevanagari-Regular.ttf')
          if not font.exists():
              raise SystemExit('Missing bundled Devanagari font')
          PY

      - name: Generate daily Hindi astrology content
        run: python -m astro_engine.main

      - name: Generate devotional video
        run: python -m video_engine.render

      - name: Create video poster
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          src = Path('output/video_scenes/000_intro.jpg')
          dst = Path('output/video_poster.png')
          if not src.exists():
              raise SystemExit(f'Missing generated intro scene: {src}')
          with Image.open(src) as im:
              im.convert('RGB').save(dst, 'PNG')
          print(f'Created {dst} from {src}')
          PY

      - name: Validate generated outputs
        run: |
          test -s output/daily_script.md
          test -s output/planetary_report.txt
          test -s output/daily_voice.mp3
          test -s output/daily_video.mp4
          test -s output/video_poster.png
          echo "===== GENERATED FILES ====="
          find output -maxdepth 2 -type f -printf '%p %k KB\n' | sort
          echo "==========================="

      - name: Upload daily production bundle
        uses: actions/upload-artifact@v4
        with:
          name: daily-astro-output-production
          path: |
            output/daily_script.md
            output/planetary_report.txt
            output/daily_voice.mp3
            output/daily_video.mp4
            output/video_poster.png
            output/deity_credits.txt
            output/video_scenes/*.jpg
          retention-days: 7
