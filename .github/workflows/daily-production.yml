name: Daily Astro Hindi Video - Production

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Validate exact AstroPratidin master logo
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          from PIL import Image
          p = Path('assets/AstroPratidin Logo.png')
          expected_git_blob = '9202b7441135ba96bbefd97b782cad65e03f3926'
          if not p.exists(): raise SystemExit(f'Missing exact master logo: {p}')
          actual = subprocess.check_output(['git','hash-object',str(p)], text=True).strip()
          if actual != expected_git_blob: raise SystemExit(f'Wrong logo asset: {actual}')
          with Image.open(p) as im:
              print('Master logo:', im.size, im.mode)
              if min(im.size) < 200: raise SystemExit('Master logo resolution too small')
          print('EXACT ASTROPRATIDIN MASTER LOGO: PASS')
          PY

      - name: Validate renderer source contract
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('video_engine/premium_entry.py').read_text(encoding='utf-8')
          required = ['assets', 'AstroPratidin Logo.png', '_header(canvas)', 'base.intro = premium_intro', '_load_master_logo(440, 440)']
          forbidden = ['_brand_logo(', 'विस्तृत फलादेश आवाज़ में सुनें', 'विस्तृत फलादेश आपकी आवाज़ में', 'assets/intro_devotional.jpg', 'intro_devotional.jpg', 'DAILY ASTRO']
          for x in required:
              if x not in s: raise SystemExit(f'Missing renderer requirement: {x}')
          for x in forbidden:
              if x in s: raise SystemExit(f'Forbidden legacy renderer content: {x}')
          print('RENDERER CONTRACT: PASS')
          PY

      - name: Compile renderer
        run: python -m py_compile video_engine/render_sync.py video_engine/premium_entry.py

      - name: Validate bundled deity assets
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          assets = Path('assets/deities')
          required = ['hanuman.jpg','lakshmi.jpg','ganesha.jpg','shiva.jpg','surya.jpg','vishnu.jpg','shani.jpg']
          for name in required:
              p = assets / name
              if not p.exists(): raise SystemExit(f'Missing deity asset: {p}')
              with Image.open(p) as im:
                  im = ImageOps.exif_transpose(im)
                  if min(im.size) < 1200: raise SystemExit(f'Artwork below 1200px: {p} -> {im.size}')
          print('DEITY ASSETS: PASS')
          PY

      - name: Clean previous generated output
        run: |
          rm -rf output
          mkdir -p output
          echo "Renderer commit: $(git rev-parse HEAD)"

      - name: Generate daily Hindi astrology content
        run: python -m astro_engine.main

      - name: Generate AstroPratidin premium audio-led video
        run: python -m video_engine.premium_entry

      - name: Validate generated outputs
        run: |
          test -s output/daily_script.md
          test -s output/planetary_report.txt
          test -s output/daily_voice.mp3
          test -s output/daily_video.mp4
          test -s output/video_poster.png
          test -s output/sync_manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image, ImageChops
          m=json.loads(Path('output/sync_manifest.json').read_text(encoding='utf-8'))
          expected=['intro','मेष','वृषभ','मिथुन','कर्क','सिंह','कन्या','तुला','वृश्चिक','धनु','मकर','कुंभ','मीन','outro']
          s=m.get('segments',[])
          if [x.get('key') for x in s] != expected: raise SystemExit('Wrong 14-segment order')
          cursor=0.0
          for x in s:
              sec=float(x['audio_seconds']); start=float(x['start_seconds']); end=float(x['end_seconds'])
              if sec<=0 or abs(start-cursor)>0.05 or abs((end-start)-sec)>0.10: raise SystemExit(f'Timeline validation failed at {x["label"]}')
              if abs(float(x.get('scene_seconds',sec))-sec)>0.10: raise SystemExit(f'Scene/audio mismatch at {x["label"]}')
              cursor=end
          if abs(float(m['total_audio_seconds'])-float(m['total_video_seconds']))>0.20: raise SystemExit('Final audio/video duration mismatch')

          # Inspect the actual rendered intro: the supplied master logo must be
          # visibly present at the center of the concentric-ring focal point.
          intro=Path('output/video_scenes/000_intro.jpg')
          with Image.open(intro).convert('RGB') as im, Image.open('assets/AstroPratidin Logo.png').convert('RGBA') as logo:
              ratio=min(440/logo.width,440/logo.height)
              logo=logo.resize((max(1,int(logo.width*ratio)),max(1,int(logo.height*ratio))),Image.Resampling.LANCZOS)
              x=(1080-logo.width)//2; y=610-logo.height//2
              expected=Image.new('RGBA',logo.size,(25,7,34,255)); expected.alpha_composite(logo)
              actual=im.crop((x,y,x+logo.width,y+logo.height))
              diff=ImageChops.difference(actual,expected.convert('RGB'))
              extrema=diff.getextrema(); mean=sum((lo+hi)/2 for lo,hi in extrema)/3
              if mean>22: raise SystemExit(f'Central master-logo visual mismatch: mean diff {mean:.1f}')

          for p in Path('output').rglob('*'):
              if p.is_file() and p.suffix.lower() in {'.md','.txt','.json'}:
                  text=p.read_text(encoding='utf-8', errors='ignore')
                  if 'विस्तृत फलादेश आवाज़ में सुनें' in text or 'विस्तृत फलादेश आपकी आवाज़ में' in text:
                      raise SystemExit(f'Forbidden legacy footer found in {p}')
          print(f'PRODUCTION validation passed: 14 exact scene/audio boundaries, {cursor:.3f}s total')
          print('CENTRAL MASTER LOGO: PASS')
          print('NO LEGACY FOOTER: PASS')
          PY

      - name: Upload daily production bundle
        uses: actions/upload-artifact@v4
        with:
          name: daily-astro-output-${{ github.run_number }}-premium
          path: |
            output/daily_script.md
            output/planetary_report.txt
            output/daily_voice.mp3
            output/daily_video.mp4
            output/video_poster.png
            output/sync_manifest.json
            output/deity_credits.txt
            output/audio_segments/*.mp3
            output/video_scenes/*.jpg
          retention-days: 7