name: AstroPratidin V21 Premium 9.5

on:
  workflow_dispatch:
  push:
    branches: [v21-premium-9-5-architecture]

permissions:
  contents: read

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout V21 branch
        uses: actions/checkout@v4
        with:
          ref: v21-premium-9-5-architecture
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify exact AstroPratidin master logo
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          from PIL import Image
          p=Path('assets/AstroPratidin Logo.png')
          expected='9202b7441135ba96bbefd97b782cad65e03f3926'
          if not p.exists(): raise SystemExit('Exact master logo missing')
          actual=subprocess.check_output(['git','hash-object',str(p)],text=True).strip()
          if actual != expected: raise SystemExit(f'Wrong logo asset: {actual}')
          with Image.open(p) as im:
              if min(im.size)<200: raise SystemExit(f'Logo resolution too small: {im.size}')
          print('EXACT MASTER LOGO: PASS')
          PY

      - name: Verify V21 renderer architecture
        run: |
          python - <<'PY'
          from pathlib import Path
          from video_engine import premium_entry as premium
          from video_engine import premium_entry_v21_1 as hardened
          from video_engine import visual_profiles as profiles

          required = [
              (premium, 'MASTER_LOGO'),
              (premium, '_load_master_logo'),
              (premium, 'premium_intro'),
              (premium, 'premium_rashi'),
              (premium, 'premium_outro'),
              (hardened, 'hardened_motion'),
              (hardened, 'motion_profile'),
              (hardened, '_normalize_sar'),
          ]
          for module, attr in required:
              if not hasattr(module, attr):
                  raise SystemExit(f'Missing V21 renderer capability: {module.__name__}.{attr}')

          logo = Path(premium.MASTER_LOGO)
          expected = Path('assets/AstroPratidin Logo.png').resolve()
          if logo.resolve() != expected:
              raise SystemExit(f'Renderer is not wired to exact master logo: {logo}')

          rashi_keys = {x[0] for x in premium.base.RASHIS}
          if set(profiles.RASHI_PROFILES) != rashi_keys:
              raise SystemExit('Rashi visual-profile coverage mismatch')
          if set(profiles.MOTION) != {'intro','push_in','drift_right','drift_left'}:
              raise SystemExit('Motion profile coverage mismatch')

          for path in Path('video_engine').rglob('*.py'):
              text = path.read_text(encoding='utf-8', errors='ignore')
              for item in ['intro_devotional.jpg','विस्तृत फलादेश आवाज़ में सुनें','विस्तृत फलादेश आपकी आवाज़ में','DAILY ASTRO']:
                  if item in text:
                      raise SystemExit(f'Forbidden legacy content in {path}: {item}')

          print('V21 RENDERER ARCHITECTURE: PASS')
          print('MASTER LOGO WIRING: PASS')
          print('12 RASHI PROFILES: PASS')
          print('MOTION + SAR NORMALIZATION CAPABILITY: PASS')
          print('NO LEGACY RENDERER CONTENT: PASS')
          PY

      - name: Compile
        run: python -m py_compile video_engine/render_sync.py video_engine/visual_profiles.py video_engine/premium_entry.py video_engine/premium_entry_v21_1.py

      - name: Generate daily content
        run: python -m astro_engine.main

      - name: Render AstroPratidin V21.5 premium production
        run: python -m video_engine.premium_entry_v21_1

      - name: Output QA
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import subprocess
          import numpy as np
          from PIL import Image

          out=Path('output')
          scenes=sorted((out/'video_scenes').glob('*.jpg'))
          motions=sorted((out/'video_scenes').glob('motion_*.mp4'))
          if len(scenes)!=14: raise SystemExit(f'Expected 14 rendered scenes, got {len(scenes)}')
          if len(motions)!=14: raise SystemExit(f'Expected 14 motion clips, got {len(motions)}')

          for p in scenes:
              with Image.open(p) as im:
                  if im.size!=(1080,1920): raise SystemExit(f'Bad dimensions: {p.name} {im.size}')

          def probe(path):
              raw=subprocess.check_output([
                  'ffprobe','-v','error','-select_streams','v:0',
                  '-show_entries','stream=width,height,sample_aspect_ratio,pix_fmt,nb_frames',
                  '-of','json',str(path)
              ],text=True)
              streams=json.loads(raw).get('streams',[])
              if not streams: raise SystemExit(f'No video stream: {path}')
              return streams[0]

          for p in motions:
              st=probe(p)
              if (st.get('width'),st.get('height'))!=(1080,1920):
                  raise SystemExit(f'Bad motion dimensions: {p.name} {st.get("width")}x{st.get("height")}')
              if st.get('sample_aspect_ratio')!='1:1':
                  raise SystemExit(f'Non-square motion SAR: {p.name} {st.get("sample_aspect_ratio")}')
              if st.get('pix_fmt')!='yuv420p':
                  raise SystemExit(f'Unexpected motion pixel format: {p.name} {st.get("pix_fmt")}')
              if not st.get('nb_frames') or int(st['nb_frames']) < 2:
                  raise SystemExit(f'Motion clip has insufficient frames: {p.name}')
          print('14 MOTION CLIPS / 1080x1920 / SAR 1:1 / yuv420p: PASS')

          final=out/'daily_video.mp4'
          if not final.exists(): raise SystemExit('Final video missing')
          st=probe(final)
          if (st.get('width'),st.get('height'))!=(1080,1920):
              raise SystemExit(f'Final video dimensions invalid: {st.get("width")}x{st.get("height")}')
          if st.get('sample_aspect_ratio')!='1:1':
              raise SystemExit(f'Final video SAR invalid: {st.get("sample_aspect_ratio")}')
          print('FINAL VIDEO / 1080x1920 / SAR 1:1: PASS')

          intro=out/'video_scenes/000_intro.jpg'
          with Image.open(intro).convert('RGB') as im, Image.open('assets/AstroPratidin Logo.png').convert('RGBA') as logo:
              ratio=min(900/logo.width,900/logo.height)
              logo=logo.resize((max(1,int(logo.width*ratio)),max(1,int(logo.height*ratio))),Image.Resampling.LANCZOS)
              x=(1080-logo.width)//2; y=610-logo.height//2
              actual=np.asarray(im.crop((x,y,x+logo.width,y+logo.height)),dtype=np.int16)
              target=np.asarray(logo.convert('RGB'),dtype=np.int16)
              alpha=np.asarray(logo.getchannel('A'),dtype=np.uint8)
              mask=alpha>=128
              mae=np.abs(actual[mask]-target[mask]).mean()
              if mae>32: raise SystemExit(f'Central master-logo visual mismatch: {mae:.1f}')
              print(f'CENTRAL MASTER LOGO: PASS (alpha-aware MAE {mae:.1f})')

          manifest=json.loads((out/'sync_manifest.json').read_text(encoding='utf-8'))
          if len(manifest.get('segments',[]))!=14: raise SystemExit('Expected 14 sync segments')
          if abs(float(manifest.get('total_video_seconds',0))-float(manifest.get('total_audio_seconds',0)))>0.20:
              raise SystemExit('Audio/video duration delta exceeds 0.20s')

          for p in out.rglob('*'):
              if p.is_file() and p.suffix.lower() in {'.md','.txt','.json'}:
                  t=p.read_text(encoding='utf-8',errors='ignore')
                  if 'विस्तृत फलादेश आवाज़ में सुनें' in t or 'विस्तृत फलादेश आपकी आवाज़ में' in t:
                      raise SystemExit(f'Forbidden legacy footer found in {p}')

          print('14 SCENES / 1080x1920: PASS')
          print('NO LEGACY FOOTER: PASS')
          print('AUDIO-LED SYNC: PASS')
          print('V21.5 OUTPUT QA: PASS')
          PY

      - name: Package production artifact
        run: zip -qr daily-astro-output-v21-premium-9-5.zip output

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-astro-output-v21-premium-9-5
          path: daily-astro-output-v21-premium-9-5.zip
          if-no-files-found: error
          retention-days: 14
