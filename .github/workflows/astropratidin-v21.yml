name: AstroPratidin Automated Production

on:
  workflow_dispatch:
    inputs:
      target_date_ist:
        description: "Publication date to generate (YYYY-MM-DD). Leave blank for normal next-day production."
        required: false
        type: string
        default: ""
  schedule:
    - cron: '30 17 * * *'

concurrency:
  group: astropratidin-daily-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: v21-premium-9-5-architecture
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2
      - name: Compile production code
        run: |
          python -m py_compile \
            video_engine/render_sync.py video_engine/visual_profiles.py \
            video_engine/premium_entry.py video_engine/premium_entry_v21_1.py \
            astro_engine/main.py astro_engine/rules.py \
            content_engine/diversity.py content_engine/script.py \
            scripts/validate_content_diversity.py \
            scripts/build_daily_youtube_videos.py scripts/publish_youtube_daily.py \
            scripts/publish_facebook_daily.py
      - name: Generate daily content
        env:
          TARGET_DATE_IST: ${{ github.event.inputs.target_date_ist || '' }}
        run: python -m astro_engine.main
      - name: Enforce content diversity guardrail
        run: python scripts/validate_content_diversity.py
      - name: Render production videos with one automatic retry
        run: |
          for attempt in 1 2; do
            python -m video_engine.premium_entry_v21_1 && exit 0
            [ "$attempt" = 2 ] && exit 1
            sleep 30
          done
      - name: Validate main output
        run: |
          test -s output/daily_video.mp4
          test -s output/daily_script.md
          test -s output/publication_date.txt
          test -s output/content_profile.json
          ffmpeg -v error -xerror -i output/daily_video.mp4 -map 0:v:0 -f null -
      - name: Build 12 individual Rashi videos with one automatic retry
        run: |
          for attempt in 1 2; do
            rm -rf output/youtube_uploads
            python scripts/build_daily_youtube_videos.py && [ "$(find output/youtube_uploads -maxdepth 1 -name '*.mp4' | wc -l)" -eq 12 ] && exit 0
            [ "$attempt" = 2 ] && exit 1
            sleep 30
          done
      - name: Upload publication bundle
        uses: actions/upload-artifact@v4
        with:
          name: astropratidin-publication-bundle
          path: output
          if-no-files-found: error
          retention-days: 14

  youtube_publish:
    name: Publish to YouTube
    needs: production
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v21-premium-9-5-architecture
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YouTube dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2
      - uses: actions/download-artifact@v5
        with:
          name: astropratidin-publication-bundle
          path: output
      - name: Publish all videos to YouTube
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.ASTROPRATIDIN_YOUTUBE_TOKEN_JSON }}
        run: python scripts/publish_youtube_daily.py
      - name: Verify YouTube publication manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('output/youtube_publish_manifest.json')
          if not p.exists(): raise SystemExit('Missing youtube_publish_manifest.json')
          count=len(json.loads(p.read_text(encoding='utf-8')).get('videos',[]))
          if count < 13: raise SystemExit(f'Expected 13 YouTube videos, found {count}')
          print(f'youtube_publish_manifest.json: PASS ({count} videos)')
          PY

  facebook_publish:
    name: Publish to Facebook
    needs: production
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v21-premium-9-5-architecture
          fetch-depth: 1
      - uses: actions/download-artifact@v5
        with:
          name: astropratidin-publication-bundle
          path: output
      - name: Publish all videos to Facebook
        env:
          FB_PAGE_ID: ${{ secrets.META_PAGE_ID || secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN || secrets.META_PAGE_ACCESS_TOKEN || secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_API_VERSION: v25.0
        run: python scripts/publish_facebook_daily.py
      - name: Verify Facebook publication manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('output/facebook_publish_manifest.json')
          if not p.exists(): raise SystemExit('Missing facebook_publish_manifest.json')
          count=len(json.loads(p.read_text(encoding='utf-8')).get('videos',[]))
          if count < 13: raise SystemExit(f'Expected 13 Facebook videos, found {count}')
          print(f'facebook_publish_manifest.json: PASS ({count} videos)')
          PY

  publication_summary:
    if: always()
    needs: [youtube_publish, facebook_publish]
    runs-on: ubuntu-latest
    steps:
      - name: Report publication status
        run: |
          echo "YouTube job result: ${{ needs.youtube_publish.result }}"
          echo "Facebook job result: ${{ needs.facebook_publish.result }}"
          [ "${{ needs.youtube_publish.result }}" = success ] && [ "${{ needs.facebook_publish.result }}" = success ]
