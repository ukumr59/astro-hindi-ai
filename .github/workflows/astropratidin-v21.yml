name: AstroPratidin Automated Production

on:
  workflow_dispatch:
    inputs:
      target_date_ist:
        description: "Publication date to generate (YYYY-MM-DD). Leave blank for normal next-day production."
        required: false
        type: string
        default: ""
  schedule:
    # 17:30 UTC = 23:00 IST
    - cron: '30 17 * * *'

concurrency:
  group: astropratidin-daily-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v21-premium-9-5-architecture
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2
      - name: Compile production code
        run: |
          python -m py_compile video_engine/render_sync.py video_engine/visual_profiles.py video_engine/premium_entry.py video_engine/premium_entry_v21_1.py astro_engine/main.py astro_engine/rules.py content_engine/diversity.py content_engine/script.py scripts/validate_content_diversity.py scripts/build_daily_youtube_videos.py scripts/build_transit_videos.py scripts/publish_youtube_daily.py scripts/publish_facebook_daily.py
      - name: Generate daily content
        env:
          TARGET_DATE_IST: ${{ github.event.inputs.target_date_ist || '' }}
        run: python -m astro_engine.main
      - name: Enforce content diversity guardrail
        run: python scripts/validate_content_diversity.py
      - name: Render production videos with one automatic retry
        run: |
          for attempt in 1 2; do
            python -m video_engine.premium_entry_v21_1 && exit 0
            [ "$attempt" = 2 ] && exit 1
            sleep 30
          done
      - name: Validate main output
        run: |
          test -s output/daily_video.mp4
          test -s output/daily_script.md
          test -s output/publication_date.txt
          test -s output/content_profile.json
          ffmpeg -v error -xerror -i output/daily_video.mp4 -map 0:v:0 -f null -
      - name: Build 12 individual Rashi videos with one automatic retry
        run: |
          for attempt in 1 2; do
            rm -rf output/youtube_uploads
            python scripts/build_daily_youtube_videos.py && [ "$(find output/youtube_uploads -maxdepth 1 -name '*.mp4' | wc -l)" -eq 12 ] && exit 0
            [ "$attempt" = 2 ] && exit 1
            sleep 30
          done
      - name: Detect next 7-day planetary transitions
        run: python scripts/detect_transits.py
      - name: Build next 7-day transition videos
        run: python scripts/build_transit_videos.py
      - name: Validate transition outputs
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, subprocess
          q=json.loads(Path('output/transit_publish_queue.json').read_text(encoding='utf-8'))
          m=json.loads(Path('output/transit_video_manifest.json').read_text(encoding='utf-8'))
          events=q.get('events', []); videos=m.get('events', [])
          if len(events) != len(videos): raise SystemExit(f'Transit mismatch: detected={len(events)} videos={len(videos)}')
          for item in videos:
              p=Path(item['video_path'])
              if not p.is_file() or p.stat().st_size == 0: raise SystemExit(f'Missing transit video: {p}')
              subprocess.run(['ffmpeg','-v','error','-xerror','-i',str(p),'-map','0:v:0','-f','null','-'],check=True)
          if len(events) > 13: raise SystemExit(f'Too many transition videos for 26-video publication cap: {len(events)}')
          print(f'Transit validation: PASS ({len(events)} event(s), {len(videos)} video(s))')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: astropratidin-publication-bundle
          path: output
          if-no-files-found: error
          retention-days: 1

  youtube_publish:
    name: Publish to YouTube
    needs: production
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v21-premium-9-5-architecture
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YouTube dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2
      - uses: actions/download-artifact@v5
        with:
          name: astropratidin-publication-bundle
          path: output
      - name: Publish up to 26 videos
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.ASTROPRATIDIN_YOUTUBE_TOKEN_JSON }}
          YOUTUBE_MAX_DAILY_UPLOADS: '26'
        run: python scripts/publish_youtube_daily.py
      - name: Verify YouTube publication manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          data=json.loads(Path('output/youtube_publish_manifest.json').read_text(encoding='utf-8'))
          count=len(data.get('videos',[])); expected=int(data.get('daily_cap',26)); planned=int(data.get('planned_total',0))
          if count < 13 or count > 26: raise SystemExit(f'Unexpected YouTube publish count: {count}; expected 13-26')
          if count != min(planned,26): raise SystemExit(f'YouTube publication incomplete: published={count}, planned={planned}')
          print(f'YouTube publication: PASS ({count}/{planned}, cap=26)')
          PY

  facebook_publish:
    name: Publish to Facebook
    needs: production
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v21-premium-9-5-architecture
          fetch-depth: 1
      - uses: actions/download-artifact@v5
        with:
          name: astropratidin-publication-bundle
          path: output
      - name: Publish up to 26 videos
        env:
          FB_PAGE_ID: ${{ secrets.META_PAGE_ID || secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN || secrets.META_PAGE_ACCESS_TOKEN || secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_API_VERSION: v25.0
          FACEBOOK_MAX_DAILY_UPLOADS: '26'
        run: python scripts/publish_facebook_daily.py
      - name: Verify Facebook publication manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          data=json.loads(Path('output/facebook_publish_manifest.json').read_text(encoding='utf-8'))
          count=len(data.get('videos',[])); planned=int(data.get('planned_total',0))
          if count < 13 or count > 26: raise SystemExit(f'Unexpected Facebook publish count: {count}; expected 13-26')
          if count != min(planned,26): raise SystemExit(f'Facebook publication incomplete: published={count}, planned={planned}')
          print(f'Facebook publication: PASS ({count}/{planned}, cap=26)')
          PY

  publication_summary:
    if: always()
    needs: [youtube_publish, facebook_publish]
    runs-on: ubuntu-latest
    steps:
      - name: Report publication status
        run: |
          echo "YouTube job result: ${{ needs.youtube_publish.result }}"
          echo "Facebook job result: ${{ needs.facebook_publish.result }}"
          [ "${{ needs.youtube_publish.result }}" = success ] && [ "${{ needs.facebook_publish.result }}" = success ]
