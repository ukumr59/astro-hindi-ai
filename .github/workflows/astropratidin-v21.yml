name: AstroPratidin Automated Production

on:
  workflow_dispatch:
    inputs:
      target_date_ist:
        description: "Publication date to generate (YYYY-MM-DD). Leave blank for normal next-day production."
        required: false
        type: string
        default: ""
  schedule:
    # 11:00 PM IST = 17:30 UTC
    - cron: '30 17 * * *'

concurrency:
  group: astropratidin-daily-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v21-premium-9-5-architecture
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --disable-pip-version-check google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2
      - name: Compile
        run: python -m py_compile video_engine/premium_entry_v21_1.py astro_engine/main.py scripts/build_daily_youtube_videos.py scripts/publish_youtube_daily.py scripts/publish_facebook_daily.py
      - name: Generate daily content
        env:
          TARGET_DATE_IST: ${{ github.event.inputs.target_date_ist || '' }}
        run: python -m astro_engine.main
      - name: Render with automatic retry
        run: |
          for n in 1 2; do python -m video_engine.premium_entry_v21_1 && exit 0; [ "$n" = 2 ] && exit 1; sleep 30; done
      - name: Validate main video
        run: |
          test -s output/daily_video.mp4
          test -s output/daily_script.md
          test -s output/publication_date.txt
          ffprobe -v error -show_streams -show_format output/daily_video.mp4
          ffmpeg -v error -xerror -i output/daily_video.mp4 -map 0:v:0 -f null -
      - name: Build 12 Rashi videos with automatic retry
        run: |
          for n in 1 2; do
            rm -rf output/youtube_uploads
            python scripts/build_daily_youtube_videos.py && [ "$(find output/youtube_uploads -maxdepth 1 -name '*.mp4' | wc -l)" -eq 12 ] && exit 0
            [ "$n" = 2 ] && exit 1
            sleep 30
          done
      - name: Build seven-day transit videos
        run: python scripts/build_transit_videos.py
      - name: Validate every file planned for publication
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          files=[Path('output/daily_video.mp4')]
          files += sorted(Path('output/youtube_uploads').glob('*.mp4'))
          manifest=Path('output/transit_video_manifest.json')
          if manifest.exists():
              files += [Path(x['video_path']) for x in json.loads(manifest.read_text(encoding='utf-8')).get('events',[])]
          if len(files) < 13:
              raise SystemExit(f'Expected at least 13 publication videos, found {len(files)}')
          for p in files:
              if not p.is_file() or p.stat().st_size < 10240:
                  raise SystemExit(f'Invalid publication file: {p}')
              print(p)
          Path('/tmp/astro_publish_files.txt').write_text('\n'.join(str(p) for p in files))
          PY
          while IFS= read -r f; do
            echo "DEEP DECODE CHECK: $f"
            ffprobe -v error -show_streams -show_format "$f" >/dev/null
            ffmpeg -v error -xerror -i "$f" -map 0:v:0 -f null -
          done < /tmp/astro_publish_files.txt
      - name: Normalize all publication videos for platform compatibility
        run: |
          while IFS= read -r f; do
            tmp="${f}.normalized.mp4"
            echo "NORMALIZING: $f"
            ffmpeg -v error -xerror -y -i "$f" -map 0:v:0 -map 0:a? -c:v libx264 -pix_fmt yuv420p -movflags +faststart -c:a aac -b:a 128k "$tmp"
            test -s "$tmp"
            ffprobe -v error -show_streams -show_format "$tmp" >/dev/null
            ffmpeg -v error -xerror -i "$tmp" -map 0:v:0 -f null -
            mv "$tmp" "$f"
          done < /tmp/astro_publish_files.txt
      - name: Final post-normalization media gate
        run: |
          while IFS= read -r f; do
            echo "FINAL MEDIA PASS: $f"
            ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -of default=noprint_wrappers=1 "$f"
            ffmpeg -v error -xerror -i "$f" -map 0:v:0 -f null -
          done < /tmp/astro_publish_files.txt
      - name: Publish to YouTube
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.ASTROPRATIDIN_YOUTUBE_TOKEN_JSON }}
        run: python scripts/publish_youtube_daily.py
      - name: Publish to Facebook
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_API_VERSION: v25.0
        run: python scripts/publish_facebook_daily.py
      - name: Verify publication manifests
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          for name in ('youtube_publish_manifest.json','facebook_publish_manifest.json'):
              p=Path('output')/name
              if not p.exists(): raise SystemExit(f'Missing {name}')
              n=len(json.loads(p.read_text(encoding='utf-8')).get('videos',[]))
              if n < 13: raise SystemExit(f'{name}: only {n} videos')
              print(f'{name}: PASS ({n} videos)')
          PY
      - name: Package artifact
        if: always()
        run: '[ -d output ] && zip -qr daily-astro-output-v21.9.5-premium.zip output || true'
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-astro-output-v21.9.5-premium
          path: daily-astro-output-v21.9.5-premium.zip
          if-no-files-found: warn
          retention-days: 14
