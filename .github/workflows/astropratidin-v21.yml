name: AstroPratidin Automated Production
on:
  workflow_dispatch:
    inputs:
      target_date_ist:
        description: Publication date (YYYY-MM-DD); blank for normal production
        required: false
        type: string
        default: ''
  schedule:
    - cron: '30 17 * * *'
concurrency:
  group: astropratidin-daily-production
  cancel-in-progress: false
permissions:
  contents: read
env:
  TARGET_DATE_IST: ${{ github.event.inputs.target_date_ist || '' }}
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v21-premium-9-5-architecture
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2
      - name: Compile
        run: python -m py_compile video_engine/premium_entry_v21_1.py astro_engine/main.py scripts/build_daily_youtube_videos.py scripts/publish_youtube_daily.py scripts/publish_facebook_daily.py scripts/build_transit_videos.py
      - name: Generate daily content
        run: python -m astro_engine.main
      - name: Render with automatic retry
        run: |
          for n in 1 2; do python -m video_engine.premium_entry_v21_1 && exit 0; [ "$n" = 2 ] && exit 1; sleep 30; done
      - name: Validate main video
        run: |
          test -s output/daily_video.mp4
          test -s output/daily_script.md
          test -s output/publication_date.txt
          ffmpeg -v error -xerror -i output/daily_video.mp4 -map 0:v:0 -f null -
      - name: Build 12 Rashi videos
        run: |
          for n in 1 2; do rm -rf output/youtube_uploads; python scripts/build_daily_youtube_videos.py && [ "$(find output/youtube_uploads -maxdepth 1 -name '*.mp4' | wc -l)" -eq 12 ] && exit 0; [ "$n" = 2 ] && exit 1; sleep 30; done
      - name: Build seven-day transit videos
        run: python scripts/build_transit_videos.py
      - name: Publication media gate
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          files=[Path('output/daily_video.mp4')]+sorted(Path('output/youtube_uploads').glob('*.mp4'))
          if len(files)<13: raise SystemExit(f'Expected 13 publication videos, found {len(files)}')
          for p in files:
              if not p.is_file() or p.stat().st_size<10240: raise SystemExit(f'Invalid publication file: {p}')
              subprocess.run(['ffmpeg','-v','error','-xerror','-i',str(p),'-map','0:v:0','-f','null','-'],check=True)
          PY
      - name: Publish to YouTube
        continue-on-error: true
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.ASTROPRATIDIN_YOUTUBE_TOKEN_JSON }}
          YOUTUBE_MAX_DAILY_UPLOADS: '1'
        run: python scripts/publish_youtube_daily.py
      - name: Publish to Facebook
        env:
          FB_PAGE_ID: ${{ secrets.META_PAGE_ID || secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN || secrets.META_PAGE_ACCESS_TOKEN || secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_API_VERSION: v25.0
        run: python scripts/publish_facebook_daily.py
      - name: Verify Facebook publication manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('output/facebook_publish_manifest.json')
          if not p.exists(): raise SystemExit('Missing facebook_publish_manifest.json')
          n=len(json.loads(p.read_text(encoding='utf-8')).get('videos',[]))
          if n<13: raise SystemExit(f'facebook_publish_manifest.json: only {n} videos')
          print(f'facebook_publish_manifest.json: PASS ({n} videos)')
          PY
      - name: Report YouTube result
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('output/youtube_publish_manifest.json')
          if p.exists(): print(f"YOUTUBE: PASS ({len(json.loads(p.read_text()).get('videos',[]))} published)")
          else: print('YOUTUBE: unavailable or failed; Facebook publication remains authoritative')
          PY
      - name: Package artifact
        if: always()
        run: '[ -d output ] && zip -qr daily-astro-output-v21.9.5-premium.zip output || true'
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-astro-output-v21.9.5-premium
          path: daily-astro-output-v21.9.5-premium.zip
          if-no-files-found: warn
          retention-days: 14
