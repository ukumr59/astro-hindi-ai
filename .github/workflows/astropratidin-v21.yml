name: AstroPratidin Automated Production
on:
  workflow_dispatch:
    inputs:
      target_date_ist:
        description: Publication date (YYYY-MM-DD); blank for normal production
        required: false
        type: string
        default: ''
      publish_facebook:
        description: Publish videos to Facebook during this manual run
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '30 10 * * *'
concurrency:
  group: astropratidin-daily-production
  cancel-in-progress: false
permissions:
  contents: read
env:
  TARGET_DATE_IST: ${{ github.event.inputs.target_date_ist || '' }}
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v21-premium-9-5-architecture
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2
      - name: Compile
        run: python -m py_compile video_engine/premium_entry_v21_1.py astro_engine/main.py scripts/build_daily_youtube_videos.py scripts/publish_youtube_daily.py scripts/publish_facebook_daily.py scripts/build_transit_videos.py
      - name: Generate daily content and next-7-day transit schedule
        run: python -m astro_engine.main
      - name: Render with automatic retry
        run: |
          for n in 1 2; do python -m video_engine.premium_entry_v21_1 && exit 0; [ "$n" = 2 ] && exit 1; sleep 30; done
      - name: Validate major daily video
        run: |
          test -s output/daily_video.mp4
          test -s output/daily_script.md
          test -s output/publication_date.txt
          ffmpeg -v error -xerror -i output/daily_video.mp4 -map 0:v:0 -f null -
          echo "MAJOR DAILY VIDEO: PASS"
      - name: Build exactly 12 individual Rashi videos
        run: |
          for n in 1 2; do rm -rf output/youtube_uploads; python scripts/build_daily_youtube_videos.py && [ "$(find output/youtube_uploads -maxdepth 1 -name '*.mp4' | wc -l)" -eq 12 ] && exit 0; [ "$n" = 2 ] && exit 1; sleep 30; done
      - name: Build videos for every major transit in next 7 days
        run: python scripts/build_transit_videos.py
      - name: Validate next-7-day transit detection and videos
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, subprocess
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          IST=ZoneInfo('Asia/Kolkata')
          schedule=Path('output/future_transits.json')
          queue=Path('output/transit_publish_queue.json')
          manifest=Path('output/transit_video_manifest.json')
          for p in (schedule, queue, manifest):
              if not p.exists(): raise SystemExit(f'Missing transit output: {p}')
          generated=json.loads(schedule.read_text(encoding='utf-8'))
          queued=json.loads(queue.read_text(encoding='utf-8')).get('events',[])
          built=json.loads(manifest.read_text(encoding='utf-8')).get('events',[])
          events=generated.get('events',[])
          start=datetime.fromisoformat(generated['window_start_ist']).astimezone(IST)
          end=start+timedelta(days=7)
          ids=set()
          for e in events:
              when=datetime.fromisoformat(e['occurrence_ist']).astimezone(IST)
              if not (start <= when <= end): raise SystemExit(f'Transit outside 7-day window: {e}')
              if e['id'] in ids: raise SystemExit(f'Duplicate transit id: {e["id"]}')
              ids.add(e['id'])
          if {e['id'] for e in queued} != ids: raise SystemExit('Transit queue does not exactly match next-7-day detection')
          if {e['id'] for e in built} != ids: raise SystemExit('Transit video manifest does not exactly match detected transits')
          for e in built:
              p=Path(e['video_path'])
              if not p.is_file() or p.stat().st_size < 10240: raise SystemExit(f'Invalid transit video: {p}')
              subprocess.run(['ffmpeg','-v','error','-xerror','-i',str(p),'-map','0:v:0','-f','null','-'],check=True)
          print(f'NEXT-7-DAY TRANSIT GATE: PASS — {len(events)} transition(s) detected and {len(built)} valid video(s) built')
          PY
      - name: 26-video publication media gate
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          main = Path('output/daily_video.mp4')
          rashis = sorted(Path('output/youtube_uploads').glob('*.mp4'))
          transits = []
          manifest = Path('output/transit_video_manifest.json')
          if manifest.exists():
              import json
              for event in json.loads(manifest.read_text(encoding='utf-8')).get('events',[]):
                  p=Path(event['video_path'])
                  if p.exists(): transits.append(p)
          files = [main] + rashis + transits
          if len(rashis) != 12:
              raise SystemExit(f'Expected exactly 12 individual Rashi videos, found {len(rashis)}')
          if len(files) > 26:
              files = files[:26]
          if len(files) < 13:
              raise SystemExit(f'Expected at least 13 publication videos, found {len(files)}')
          for p in files:
              if not p.is_file() or p.stat().st_size < 10240:
                  raise SystemExit(f'Invalid publication file: {p}')
              subprocess.run(['ffmpeg','-v','error','-xerror','-i',str(p),'-map','0:v:0','-f','null','-'],check=True)
          print(f'PRODUCTION MEDIA GATE: PASS — {len(files)} video(s) available for publication (1 major + 12 Rashi + {max(0,len(files)-13)} transit)')
          PY
      - name: Publish to YouTube
        continue-on-error: true
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.ASTROPRATIDIN_YOUTUBE_TOKEN_JSON }}
          YOUTUBE_MAX_DAILY_UPLOADS: '26'
        run: python scripts/publish_youtube_daily.py
      - name: Publish to Facebook
        if: github.event_name == 'schedule' || github.event.inputs.publish_facebook == 'true'
        env:
          FB_PAGE_ID: ${{ secrets.META_PAGE_ID || secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN || secrets.META_PAGE_ACCESS_TOKEN || secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_API_VERSION: v25.0
          FACEBOOK_MAX_DAILY_UPLOADS: '26'
        run: python scripts/publish_facebook_daily.py
      - name: Verify Facebook publication manifest
        if: github.event_name == 'schedule' || github.event.inputs.publish_facebook == 'true'
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, os
          p=Path('output/facebook_publish_manifest.json')
          if not p.exists(): raise SystemExit('Missing facebook_publish_manifest.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          n=len(data.get('videos',[]))
          cap=min(26,max(1,int(os.environ.get('FACEBOOK_MAX_DAILY_UPLOADS','26'))))
          if n>cap: raise SystemExit(f'facebook_publish_manifest.json: {n} videos exceeds daily cap {cap}')
          if n<13: raise SystemExit(f'facebook_publish_manifest.json: only {n} videos, expected at least 13')
          print(f'facebook_publish_manifest.json: PASS ({n} videos, cap={cap})')
          PY
        env:
          FACEBOOK_MAX_DAILY_UPLOADS: '26'
      - name: Report YouTube result
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('output/youtube_publish_manifest.json')
          if p.exists():
              data=json.loads(p.read_text())
              n=len(data.get('videos',[])); cap=int(data.get('daily_cap',26))
              if n>26: raise SystemExit(f'YOUTUBE: {n} published exceeds hard cap 26')
              print(f'YOUTUBE: PASS ({n} published, cap={cap})')
          else: print('YOUTUBE: unavailable or failed; Facebook publication remains authoritative')
          PY
      - name: Production summary
        if: always()
        run: |
          echo "Production summary: publish up to 26 videos per platform — 1 major daily video + 12 individual Rashi videos + all detected major planetary transition videos. Manual runs default to YouTube only; Facebook publication is enabled for scheduled runs or when the manual publish_facebook option is selected."