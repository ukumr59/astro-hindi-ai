name: Daily Astro Hindi Video

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax smoke test
        run: python -m py_compile video_engine/render_sync.py video_engine/premium_entry.py

      - name: Validate bundled devotional assets
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          assets = Path('assets/deities')
          required = ['hanuman.jpg','lakshmi.jpg','ganesha.jpg','shiva.jpg','surya.jpg','vishnu.jpg','shani.jpg']
          for name in required:
              p = assets / name
              if not p.exists(): raise SystemExit(f'Missing deity asset: {p}')
              with Image.open(p) as im:
                  im = ImageOps.exif_transpose(im)
                  print(name, im.size, im.mode)
                  if min(im.size) < 1200: raise SystemExit(f'Artwork below 1200px: {p} -> {im.size}')
          for p in ['assets/NotoSansDevanagari-Regular.ttf','assets/intro_devotional.jpg']:
              if not Path(p).exists(): raise SystemExit(f'Missing required asset: {p}')
          PY

      - name: Clean previous generated output
        run: |
          rm -rf output
          mkdir -p output
          echo "Renderer commit: $(git rev-parse HEAD)"

      - name: Generate daily Hindi astrology content
        run: python -m astro_engine.main

      - name: Generate V5 premium audio-led devotional video
        run: python -m video_engine.premium_entry

      - name: Validate generated outputs
        run: |
          test -s output/daily_script.md
          test -s output/planetary_report.txt
          test -s output/daily_voice.mp3
          test -s output/daily_video.mp4
          test -s output/video_poster.png
          test -s output/sync_manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('output/sync_manifest.json').read_text(encoding='utf-8'))
          expected=['intro','मेष','वृषभ','मिथुन','कर्क','सिंह','कन्या','तुला','वृश्चिक','धनु','मकर','कुंभ','मीन','outro']
          s=m.get('segments',[])
          if [x.get('key') for x in s] != expected: raise SystemExit('Wrong 14-segment order')
          cursor=0.0
          for x in s:
              sec=float(x['audio_seconds']); start=float(x['start_seconds']); end=float(x['end_seconds'])
              if sec<=0 or abs(start-cursor)>0.05 or abs((end-start)-sec)>0.10: raise SystemExit(f"Timeline validation failed at {x['label']}")
              if abs(float(x.get('scene_seconds',sec))-sec)>0.10: raise SystemExit(f"Scene/audio mismatch at {x['label']}")
              cursor=end
          if abs(float(m['total_audio_seconds'])-float(m['total_video_seconds']))>0.20: raise SystemExit('Final audio/video duration mismatch')
          print(f'PREMIUM validation passed: 14 exact scene/audio boundaries, {cursor:.3f}s total')
          PY

      - name: Upload daily production bundle
        uses: actions/upload-artifact@v4
        with:
          name: daily-astro-output-${{ github.run_number }}-premium
          path: |
            output/daily_script.md
            output/planetary_report.txt
            output/daily_voice.mp3
            output/daily_video.mp4
            output/video_poster.png
            output/sync_manifest.json
            output/deity_credits.txt
            output/audio_segments/*.mp3
            output/video_scenes/*.jpg
          retention-days: 7
