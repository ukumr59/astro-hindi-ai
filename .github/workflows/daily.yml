name: Daily Astro Hindi Video

on:
  push:
    branches: [main]
  schedule:
    # 08:00 IST daily (02:30 UTC)
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate bundled devotional assets
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          assets = Path('assets/deities')
          required = ['hanuman.jpg','lakshmi.jpg','ganesha.jpg','shiva.jpg','surya.jpg','vishnu.jpg','shani.jpg']
          for name in required:
              p = assets / name
              if not p.exists():
                  raise SystemExit(f'Missing deity asset: {p}')
              with Image.open(p) as im:
                  print(name, im.size, im.mode)
                  if im.width < 1200 or im.height < 1200:
                      raise SystemExit(f'Artwork is below 1200px: {p} -> {im.size}')
          font = Path('assets/NotoSansDevanagari-Regular.ttf')
          if not font.exists():
              raise SystemExit('Missing bundled Devanagari font')
          PY

      - name: Generate daily Hindi astrology content
        run: python -m astro_engine.main

      - name: Generate audio-led synchronized devotional video
        run: python -m video_engine.render_sync

      - name: Validate generated outputs
        run: |
          test -s output/daily_script.md
          test -s output/planetary_report.txt
          test -s output/daily_voice.mp3
          test -s output/daily_video.mp4
          test -s output/video_poster.png
          test -s output/sync_manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path('output/sync_manifest.json').read_text(encoding='utf-8'))
          segments = m.get('segments', [])
          if len(segments) != 14:
              raise SystemExit(f'Expected 14 sync segments, got {len(segments)}')
          if [x.get('key') for x in segments] != ['intro','मेष','वृषभ','मिथुन','कर्क','सिंह','कन्या','तुला','वृश्चिक','धनु','मकर','कुंभ','मीन','outro']:
              raise SystemExit('Sync manifest is not in canonical Intro -> 12 Rashis -> Outro order')
          cursor = 0.0
          for x in segments:
              sec = float(x.get('audio_seconds', 0))
              if sec <= 0:
                  raise SystemExit(f"Zero/negative duration in segment {x.get('label')}")
              start = float(x.get('start_seconds', cursor))
              end = float(x.get('end_seconds', start + sec))
              if abs(start - cursor) > 0.05:
                  raise SystemExit(f"Timeline gap/overlap before {x.get('label')}: expected {cursor:.3f}, got {start:.3f}")
              if abs((end - start) - sec) > 0.10:
                  raise SystemExit(f"Manifest duration mismatch in {x.get('label')}")
              cursor = end
          print(f'Audio-led timeline validation passed: 14 contiguous segments, total {cursor:.3f}s')
          PY
          echo "===== GENERATED FILES ====="
          find output -maxdepth 2 -type f -printf '%p %k KB\n' | sort
          echo "==========================="

      - name: Upload daily production bundle
        uses: actions/upload-artifact@v4
        with:
          name: daily-astro-output-${{ github.run_number }}
          path: |
            output/daily_script.md
            output/planetary_report.txt
            output/daily_voice.mp3
            output/daily_video.mp4
            output/video_poster.png
            output/sync_manifest.json
            output/deity_credits.txt
            output/video_scenes/*.jpg
          retention-days: 7
