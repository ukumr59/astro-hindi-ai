name: Daily Astro Hindi Video

on:
  schedule:
    # 8:00 AM India time (IST)
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:

  generate:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate daily Hindi astrology content
        run: |
          python -m astro_engine.main

      - name: Generate Hindi video
        run: |
          python -m video_engine.render

      - name: Check generated files
        run: |
          echo "===== OUTPUT FILES ====="
          ls -lah output
          echo "========================"

          test -f output/daily_script.md
          test -f output/daily_voice.mp3
          test -f output/daily_video.mp4

      - name: Upload generated files
        uses: actions/upload-artifact@v4
        with:
          name: daily-astro-output
          path: |
            output/daily_script.md
            output/planetary_report.txt
            output/daily_voice.mp3
            output/daily_subtitles.ass
            output/daily_video.mp4
          retention-days: 7

      - name: YouTube publishing
        if: ${{ vars.YOUTUBE_ENABLED == 'true' }}
        run: |
          echo "YouTube publishing will be activated after API credentials are configured."

      - name: Facebook publishing
        if: ${{ vars.FACEBOOK_ENABLED == 'true' }}
        run: |
          echo "Facebook publishing will be activated after API credentials are configured."
