name: AstroPratidin V20 Production

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout corrected production main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify exact AstroPratidin master logo
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          from PIL import Image
          p = Path('assets/AstroPratidin Logo.png')
          expected = '9202b7441135ba96bbefd97b782cad65e03f3926'
          if not p.exists(): raise SystemExit('Exact master logo missing')
          actual = subprocess.check_output(['git','hash-object',str(p)], text=True).strip()
          if actual != expected: raise SystemExit(f'Wrong logo asset: {actual}')
          with Image.open(p) as im:
              if min(im.size) < 200: raise SystemExit(f'Logo resolution too small: {im.size}')
          print('EXACT MASTER LOGO: PASS')
          PY

      - name: Verify renderer contract
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('video_engine/premium_entry.py').read_text(encoding='utf-8')
          forbidden=['_brand_logo(', 'विस्तृत फलादेश आवाज़ में सुनें','विस्तृत फलादेश आपकी आवाज़ में','DAILY ASTRO','intro_devotional.jpg']
          for x in forbidden:
              if x in s: raise SystemExit(f'Forbidden legacy content: {x}')
          for x in ['AstroPratidin Logo.png','premium_intro','_load_master_logo(440, 440)']:
              if x not in s: raise SystemExit(f'Missing V20.1 requirement: {x}')
          print('RENDERER CONTRACT: PASS')
          PY

      - name: Compile
        run: python -m py_compile video_engine/render_sync.py video_engine/premium_entry.py

      - name: Generate daily content
        run: python -m astro_engine.main

      - name: Render AstroPratidin V20.1 production
        run: python -m video_engine.premium_entry

      - name: Output QA
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from PIL import Image, ImageChops
          out=Path('output')
          scenes=sorted((out/'video_scenes').glob('*.jpg'))
          if len(scenes)!=14: raise SystemExit(f'Expected 14 rendered scenes, got {len(scenes)}')
          for p in scenes:
              with Image.open(p) as im:
                  if im.size!=(1080,1920): raise SystemExit(f'Bad dimensions: {p.name} {im.size}')
          intro=out/'video_scenes/000_intro.jpg'
          with Image.open(intro).convert('RGB') as im, Image.open('assets/AstroPratidin Logo.png').convert('RGBA') as logo:
              ratio=min(440/logo.width,440/logo.height)
              logo=logo.resize((max(1,int(logo.width*ratio)),max(1,int(logo.height*ratio))),Image.Resampling.LANCZOS)
              x=(1080-logo.width)//2; y=610-logo.height//2
              expected=Image.new('RGBA',logo.size,(25,7,34,255))
              expected.alpha_composite(logo)
              actual=im.crop((x,y,x+logo.width,y+logo.height))
              # JPEG compression is allowed, but the actual rendered pixels must
              # remain close to the exact master-logo composite.
              diff=ImageChops.difference(actual,expected.convert('RGB'))
              extrema=diff.getextrema()
              mean=sum((lo+hi)/2 for lo,hi in extrema)/3
              if mean>22: raise SystemExit(f'Central master-logo visual mismatch: mean diff {mean:.1f}')
          # No legacy footer may survive in generated text/metadata.
          for p in out.rglob('*'):
              if p.is_file() and p.suffix.lower() in {'.md','.txt','.json'}:
                  text=p.read_text(encoding='utf-8',errors='ignore')
                  if 'विस्तृत फलादेश आवाज़ में सुनें' in text or 'विस्तृत फलादेश आपकी आवाज़ में' in text:
                      raise SystemExit(f'Forbidden legacy footer found in {p}')
          m=json.loads((out/'sync_manifest.json').read_text(encoding='utf-8'))
          if len(m.get('segments',[]))!=14: raise SystemExit('Expected 14 sync segments')
          print('14 SCENES / 1080x1920: PASS')
          print('CENTRAL MASTER LOGO: PASS')
          print('NO LEGACY FOOTER: PASS')
          print('14-SEGMENT SYNC: PASS')
          print('OUTPUT QA: PASS')
          PY

      - name: Package production artifact
        run: zip -qr daily-astro-output-v20-premium.zip output

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-astro-output-v20-premium
          path: daily-astro-output-v20-premium.zip
          if-no-files-found: error
          retention-days: 14