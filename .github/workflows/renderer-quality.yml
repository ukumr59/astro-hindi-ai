name: Renderer Quality Gate

on:
  push:
    branches: [main, premium-9-3-brand-consistency]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile renderer
        run: python -m py_compile video_engine/render_sync.py video_engine/premium_entry.py

      - name: Run brand consistency guard
        run: python tests/test_branding.py

      - name: Validate master logo asset
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          p = Path('assets/brand/astropratidin_logo.webp')
          if not p.exists():
              raise SystemExit(f'Missing {p}')
          with Image.open(p) as im:
              print('AstroPratidin master logo:', im.size, im.mode)
              if min(im.size) < 160:
                  raise SystemExit('Master logo is below 160px and is not production-safe')
          PY
